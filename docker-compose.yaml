services:
  dm:
    image: ghcr.io/poaudet/lean-dm:latest
    container_name: lean-dm
    restart: unless-stopped
    ports:
      - "${DM_PORT:-7860}:7860"
    environment:
      - DM_BASE_URL=${DM_BASE_URL:-}
      - DM_API_KEY=${DM_API_KEY:-}
      - DM_MODEL=${DM_MODEL:-}
      - DM_WEB_PASSWORD=${DM_WEB_PASSWORD:-}
      - SCRIBE_MODEL=${SCRIBE_MODEL:-}
      - HISTORY_TURNS=${HISTORY_TURNS:-8}
      - CAMPAIGN=${CAMPAIGN:-default}
      - DM_TRUST_PROXY=${DM_TRUST_PROXY:-}
    volumes:
      - ./campaigns:/app/campaigns    # source of truth stays on the host
